<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MyFF Dashboard</title>

<style>

body{

    font-family:'Segoe UI',sans-serif;

    background:#f8fafc;

    margin:0;

    color:#102a43;
}

.header{

    background:#12355b;

    color:white;

    padding:20px 40px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.content{

    max-width:1200px;

    margin:40px auto;

    padding:0 20px;
}

.card{

    background:white;

    padding:25px;

    border-radius:16px;

    margin-bottom:20px;

    box-shadow:
        0 8px 18px rgba(0,0,0,.06);
}

.card h2{

    margin-top:0;

    color:#12355b;
}

.button{

    background:#12355b;

    color:white;

    border:none;

    padding:12px 18px;

    border-radius:10px;

    cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h2>

MyFF Network

</h2>

<button
class="button"
id="logoutBtn">

Logout

</button>

</div>

<div class="content">

<div class="card">

<h2>

Welcome

</h2>

<p id="welcomeText">

Loading...

</p>

</div>

<div class="card">

<h2>

MyFF Dashboard

</h2>

<div class="menu-links">

    <p><a href="profile.html">👤 My Profile</a></p>

    <p><a href="network.html">🤝 My Network</a></p>

    <p><a href="opportunities.html">💼 Opportunities</a></p>

    <p><a href="connections.html">🔗 My Connections</a></p>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>

<script>

const {
    Client,
    Account
} = Appwrite;

const client = new Client();

client
    .setEndpoint("https://cloud.appwrite.io/v1")
    .setProject("6ac6fecf002db308564b");

const account = new Account(client);

async function loadUser(){

    try{

        const user =
            await account.get();

        document.getElementById(
            "welcomeText"
        ).innerHTML =
            "Welcome " +
            user.name;

    }
    catch(error){

     console.error(
        "ACCOUNT.GET ERROR:",
        error
    );

    alert(
        error.message
    );

    }

}

loadUser();

document
.getElementById("logoutBtn")
.addEventListener("click", async function(){

    await account.deleteSession(
        "current"
    );

    window.location.href =
        "login.html";

});

</script>

</body>

</html>
