</style></head><body><header class="rm-site-header"><div class="rm-header-inner"><a class="rm-brand" href="index.html" aria-label="ReferMe Network homepage"><svg class="rm-network-icon" viewBox="0 0 52 48" width="43" height="40" role="img" aria-label="Trusted relationship network"><g stroke="#A6D64F" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M9 24 L24 9 L42 15 M9 24 L24 39 L42 31 M24 9 L42 31 M42 15 L24 39"/></g><circle cx="9" cy="24" r="6.5" fill="#A6D64F" stroke="#E1EDFA" stroke-width="1"/><circle cx="9" cy="22.2" r="1.7" fill="#194778"/><path d="M6 27 Q9 24 12 27" stroke="#194778" stroke-width="1.2" fill="none"/><circle cx="24" cy="9" r="6.5" fill="#2D6090" stroke="#E1EDFA" stroke-width="1"/><circle cx="24" cy="7.2" r="1.7" fill="#FFFFFF"/><path d="M21 12 Q24 9 27 12" stroke="#FFFFFF" stroke-width="1.2" fill="none"/><circle cx="42" cy="15" r="6.5" fill="#2D6090" stroke="#E1EDFA" stroke-width="1"/><circle cx="42" cy="13.2" r="1.7" fill="#FFFFFF"/><path d="M39 18 Q42 15 45 18" stroke="#FFFFFF" stroke-width="1.2" fill="none"/><circle cx="24" cy="39" r="6.5" fill="#2D6090" stroke="#E1EDFA" stroke-width="1"/><circle cx="24" cy="37.2" r="1.7" fill="#FFFFFF"/><path d="M21 42 Q24 39 27 42" stroke="#FFFFFF" stroke-width="1.2" fill="none"/><circle cx="42" cy="31" r="6.5" fill="#2D6090" stroke="#E1EDFA" stroke-width="1"/><circle cx="42" cy="29.2" r="1.7" fill="#FFFFFF"/><path d="M39 34 Q42 31 45 34" stroke="#FFFFFF" stroke-width="1.2" fill="none"/></svg><span class="rm-brand-words"><span class="rm-wordmark">refer<span class="rm-green">Me</span> Network</span><span class="rm-tagline">Connected by Trust · Growing Together</span></span></a><nav class="rm-nav" aria-label="Main navigation"><a href="index.html#about">About</a><a href="login.html">Login</a><a class="rm-join" href="register.html">Join Network</a></nav></div></header><main><section class="card"><h1>Set a new password</h1><p>Choose a strong password for your referMe account.</p><form id="resetForm"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><div class="hint">At least 8 characters, with uppercase, lowercase, a number, and a symbol.</div><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Update password</button></form><div id="message" class="message" role="status" aria-live="polite"></div><a class="back" href="login.html">← Back to Login</a></section></main><script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script><script>const { Client, Account } = Appwrite;
const client = new Client().setEndpoint("https://cloud.appwrite.io/v1").setProject("6ac6fecf002db308564b");
const account = new Account(client);
const form = document.querySelector("form");
const message = document.getElementById("message");
function showMessage(text, isError=false){message.textContent=text;message.style.color=isError?"#b42318":"#17603d";}

const params=new URLSearchParams(location.search);const userId=params.get("userId"),secret=params.get("secret");
if(!userId||!secret){form.style.display="none";showMessage("This reset link is missing required information. Please request a new one.",true)}
form.addEventListener("submit",async(e)=>{e.preventDefault();const password=document.getElementById("password").value;
if(!(password.length>=8&&/[A-Z]/.test(password)&&/[a-z]/.test(password)&&/[0-9]/.test(password)&&/[^A-Za-z0-9]/.test(password))){showMessage("Please use at least 8 characters, including uppercase, lowercase, a number and a symbol.",true);return}
if(password!==document.getElementById("confirm").value){showMessage("Passwords do not match.",true);return}
const btn=form.querySelector("button");btn.disabled=true;try{
await account.updateRecovery(userId,secret,password);
showMessage("Your password has been updated. You can now sign in.");form.style.display="none";
}catch(err){console.error(err);showMessage("Reset failed. Your link may have expired or already been used. Please request a new one.",true)}finally{btn.disabled=false}});
</script></body></html>
