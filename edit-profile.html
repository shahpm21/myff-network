<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Profile</title>

<style>

body{
    font-family:Segoe UI,sans-serif;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:#12355b;
    color:white;
    padding:20px 40px;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.row{
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:600;
    margin-bottom:5px;
}

input,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

textarea{
    min-height:120px;
}

.btn{
    background:#12355b;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.btn:hover{
    background:#0f2947;
}

.back{
    display:inline-block;
    margin-bottom:15px;
    text-decoration:none;
    color:#12355b;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
    <h1>Edit Profile</h1>
</div>

<div class="container">

<a href="profile.html" class="back">
← Back to Profile
</a>

<div class="card">

<form id="profileForm">

<div class="row">
<label>First Name</label>
<input type="text" id="first_name">
</div>

<div class="row">
<label>Last Name</label>
<input type="text" id="last_name">
</div>

<div class="row">
<label>Email</label>
<input type="email" id="email" disabled>
</div>

<div class="row">
<label>Phone</label>
<input type="text" id="phone">
</div>

<div class="row">
<label>City</label>
<input type="text" id="city">
</div>

<div class="row">
<label>State</label>
<input type="text" id="state">
</div>
        
<div class="row">
<label>ZIP Code</label>
<input type="text" id="zipcode">
</div>
    
<div class="row">
<label>Country</label>
<input type="text" id="country">
</div>

<div class="row">
<label>Company</label>
<input type="text" id="company">
</div>

<div class="row">
<label>Role</label>
<input type="text" id="role">
</div>
    
<div class="row">
<label>Other Industry</label>
<input type="text" id="industry_other">
</div>

    <div class="row">

<label>Professional Status</label>

<label><input type="checkbox" name="professional_status" value="Employee"> Employee</label><br>

<label><input type="checkbox" name="professional_status" value="Seeking Employment"> Seeking Employment</label><br>

<label><input type="checkbox" name="professional_status" value="Consultant"> Consultant</label><br>

<label><input type="checkbox" name="professional_status" value="Business Owner"> Business Owner</label><br>

<label><input type="checkbox" name="professional_status" value="Entrepreneur"> Entrepreneur</label>

</div>    

    <div class="row">

<label>Industry</label>

<label><input type="checkbox" name="industry" value="Manufacturing"> Manufacturing</label><br>

<label><input type="checkbox" name="industry" value="Supply Chain"> Supply Chain</label><br>

<label><input type="checkbox" name="industry" value="Engineering"> Engineering</label><br>

<label><input type="checkbox" name="industry" value="Information Technology"> IT</label><br>

<label><input type="checkbox" name="industry" value="Healthcare"> Healthcare</label><br>

<label><input type="checkbox" name="industry" value="Human Resource"> Human Resource</label>

</div>
<div class="row">

<label>Support Seeking</label>

<label><input type="checkbox" name="support_seeking" value="New Job Opportunities"> New Job Opportunities</label><br>

<label><input type="checkbox" name="support_seeking" value="Employee Referrals"> Employee Referrals</label><br>

<label><input type="checkbox" name="support_seeking" value="Mentorship"> Mentorship</label><br>

<label><input type="checkbox" name="support_seeking" value="Professional Networking"> Professional Networking</label>

</div>
    <div class="row">

<label>Support Available</label>

<label><input type="checkbox" name="support_types" value="Employee Referrals"> Employee Referrals</label><br>

<label><input type="checkbox" name="support_types" value="Resume Reviews"> Resume Reviews</label><br>

<label><input type="checkbox" name="support_types" value="Career Advice"> Career Advice</label><br>

<label><input type="checkbox" name="support_types" value="Mentoring"> Mentoring</label>

</div>

<div class="row">
<label>Comments</label>
<textarea id="comments"></textarea>
</div>

<button class="btn" type="submit">
Save Changes
</button>

</form>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>

<script>

const {
    Client,
    Account,
    Databases,
    Query
} = Appwrite;

const client = new Client();

client
.setEndpoint("https://cloud.appwrite.io/v1")
.setProject("6ac6fecf002db308564b");

const account = new Account(client);
const databases = new Databases(client);

const DATABASE_ID = "myff";
const PROFILES_ID = "Profiles";

let documentId = "";

loadProfile();

async function loadProfile(){

    const p = results.documents[0];
    console.log(p);
    
    try{

        const user = await account.get();

        const results =
        await databases.listDocuments(
            DATABASE_ID,
            PROFILES_ID,
            [
                Query.equal(
                    "user_id",
                    user.$id
                )
            ]
        );

        if(results.documents.length === 0){

            alert("Profile not found");
            return;

        }

        const p =
        results.documents[0];

        documentId =
        p.$id;

        document.getElementById("first_name").value =
            p.first_name || "";

        document.getElementById("last_name").value =
            p.last_name || "";

        document.getElementById("email").value =
            p.email || "";

        document.getElementById("phone").value =
            p.phone || "";

        document.getElementById("city").value =
            p.city || "";

        document.getElementById("state").value =
            p.state || "";
document.getElementById("zipcode").value =
    p.zipcode || "";
        document.getElementById("country").value =
            p.country || "";

        document.getElementById("company").value =
            p.company || "";

        document.getElementById("role").value =
            p.role || "";

industry_other:
    document.getElementById("industry_other").value,

inviter_name:
    document.getElementById("inviter_name").value,

inviter_phone:
    document.getElementById("inviter_phone").value,

share_email:
    document.getElementById("share_email").checked,

professional_status:
    getCheckedValues("professional_status"),

industry:
    getCheckedValues("industry"),

support_seeking:
    getCheckedValues("support_seeking"),

support_types:
    getCheckedValues("support_types"),
        
        document.getElementById("comments").value =
            p.comments || "";

    }
    catch(error){

        console.error(error);

        window.location.href =
            "login.html";
    }

}

document
.getElementById("profileForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    try{

        await databases.updateDocument(
            DATABASE_ID,
            PROFILES_ID,
            documentId,
            {

                first_name:
                    document.getElementById("first_name").value,

                last_name:
                    document.getElementById("last_name").value,

                phone:
                    document.getElementById("phone").value,

                city:
                    document.getElementById("city").value,

                state:
                    document.getElementById("state").value,

                country:
                    document.getElementById("country").value,

                company:
                    document.getElementById("company").value,

                role:
                    document.getElementById("role").value,

                comments:
                    document.getElementById("comments").value

            }
        );

        alert("Profile Updated Successfully");

        window.location.href =
            "profile.html";

    }
    catch(error){

        console.error(error);

        alert(error.message);

    }

});

</script>

</body>
</html>
