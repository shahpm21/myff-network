<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#f4f6f9;
    color:#12355b;
}

header{
    background:#12355b;
    color:white;
    padding:25px 50px;
}

header h1{
    font-size:34px;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.profile-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.profile-header h2{
    font-size:32px;
}

.edit-btn{
    display:inline-block;
    background:#12355b;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    text-decoration:none;
    font-weight:600;
    cursor:pointer;
}

.edit-btn:hover{
    background:#0f2947;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.field{
    background:#f8fafc;
    padding:16px;
    border-radius:12px;
}

.label{
    font-size:12px;
    color:#64748b;
    text-transform:uppercase;
    margin-bottom:5px;
}

.value{
    font-size:18px;
    font-weight:600;
}

.back-link{
    display:inline-block;
    margin-bottom:20px;
    text-decoration:none;
    color:#12355b;
    font-weight:600;
}

.loading{
    text-align:center;
    padding:40px;
    font-size:20px;
}

<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>

<script>

const {
    Client,
    Account,
    Databases,
    Query
} = Appwrite;

const client = new Client();

client
.setEndpoint("https://cloud.appwrite.io/v1")
.setProject("6ac6fecf002db308564b");

const account = new Account(client);
const databases = new Databases(client);

const DATABASE_ID = "myff";
const PROFILES_ID = "Profiles";

loadProfile();

async function loadProfile(){

    try{

        const user = await account.get();

        const result =
        await databases.listDocuments(
            DATABASE_ID,
            PROFILES_ID,
            [
                Query.equal(
                    "user_id",
                    user.$id
                )
            ]
        );

        if(result.documents.length === 0){

            alert("Profile not found");
            return;
        }

        const p =
        result.documents[0];
console.log(p);
document.getElementById("name").textContent =
     (p.first_name || "") + " " + (p.last_name || "");

        document.getElementById("email").textContent =
            p.email || "";

        document.getElementById("phone").textContent =
            p.phone || "";

        document.getElementById("city").textContent =
            p.city || "";

        document.getElementById("state").textContent =
            p.state || "";

        document.getElementById("country").textContent =
            p.country || "";

        document.getElementById("industry").textContent =
            p.industry || p.industry_other || "";

        document.getElementById("company").textContent =
            p.company || "";

        document.getElementById("job_title").textContent =
       p.role || "";
        
document.getElementById("professional_status").textContent =
    Array.isArray(p.professional_status)
        ? p.professional_status.join(", ")
        : (p.professional_status || "");
        
        document.getElementById("support_seeking").textContent =
            p.support_seeking || "";

        document.getElementById("support_available").textContent =
            p.support_available || "";

        document.getElementById("about_me").textContent =
           p.comments || "";

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("profileContent").style.display =
            "block";

    }

    catch(error){

        console.error(error);

        window.location.href =
            "login.html";
    }

}

</script>

<script>document.getElementById("logoutBtn").addEventListener("click", async () => { try { await account.deleteSession("current"); location.href="login.html"; } catch(e) { console.error(e); alert("Unable to log out. Please try again."); } });</script>
