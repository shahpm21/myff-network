<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#f4f8fd;
    color:#102a43;
}

/* HEADER */

.header{

    background:
    linear-gradient(
        135deg,
        #12355b,
        #1f4e79
    );

    padding:10px 28px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.brand{

    display:flex;

    align-items:center;

    gap:12px;
}

.logo-icon{

    width:44px;

    height:44px;

    object-fit:contain;
}

.brand-text{

    display:flex;

    flex-direction:column;
}

.logo{

    display:flex;

    align-items:flex-end;
}

.logo-refer{

    color:white;

    font-size:28px;

    font-weight:800;
}

.logo-me{

    color:#8BC53F;

    font-size:28px;

    font-weight:800;
}

.logo-network{

    color:#dbeafe;

    font-size:22px;

    font-weight:600;

    margin-left:8px;
}

.tagline{

    color:#dbeafe;

    font-size:11px;
}

.header-buttons{

    display:flex;

    gap:10px;
}

.header-btn{

    background:rgba(255,255,255,.12);

    color:white;

    border:1px solid rgba(255,255,255,.2);

    padding:10px 14px;

    border-radius:10px;

    cursor:pointer;
}

.active-btn{

    background:#8BC53F;

    border-color:#8BC53F;

    color:#12355b;
}

/* PAGE */

.container{

    max-width:1400px;

    margin:24px auto;

    padding:0 20px;
}

.page-title{

    text-align:center;

    margin-bottom:24px;
}

.page-title h1{

    color:#12355b;

    margin-bottom:6px;
}

.page-title p{

    color:#64748b;
}

.tree-card{

    background:white;

    border-radius:20px;

    padding:30px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.06);
}

.legend{

    display:flex;

    gap:20px;

    justify-content:center;

    margin-bottom:30px;
}

.legend-item{

    display:flex;

    align-items:center;

    gap:8px;
}

.dot{

    width:14px;

    height:14px;

    border-radius:50%;
}

.l0-dot{
    background:#8BC53F;
}

.l1-dot{
    background:#0ea5e9;
}

.l2-dot{
    background:#EE7D11;
}

.l3-dot{
    background:#94a3b8;
}

/* TREE */

.tree{

    display:flex;

    justify-content:center;
}
.tree-root{
    list-style:none;
    padding-left:0;
}
.tree ul{
border-left:2px solid #cbd5e1;
    margin-left:25px;
    padding-left:20px;
    padding-top:20px;

    position:relative;

    transition:.3s;
}

.tree li{

    float:left;

    text-align:center;

    list-style:none;
margin:10px 0;
    position:relative;

    padding:20px 5px 0 5px;
}

/* CONNECTOR LINES */

.tree li::before,
.tree li::after{

    content:'';

    position:absolute;

    top:0;

    right:50%;

    border-top:2px solid #cbd5e1;

    width:50%;

    height:20px;
}

.tree li::after{

    right:auto;

    left:50%;

    border-left:2px solid #cbd5e1;
}

.tree li:only-child::after,
.tree li:only-child::before{

    display:none;
}

.tree li:only-child{

    padding-top:0;
}

.tree li:first-child::before{

    border:none;
}

.tree li:last-child::after{

    border:none;
}

.tree ul ul::before{

    content:'';

    position:absolute;

    top:0;

    left:50%;

    border-left:2px solid #cbd5e1;

    width:0;

    height:20px;
}

/* NODES */

.node{

    border-radius:14px;

    padding:12px 18px;

    display:inline-block;

    min-width:120px;

    color:white;

    font-weight:600;

    box-shadow:
        0 4px 12px rgba(0,0,0,.08);
}

.l0{

    background:#8BC53F;
}

.l1{

    background:#0ea5e9;
}

.l2{

    background:#EE7D11;
}

.l3{

    background:#94a3b8;
}

.node small{

    display:block;

    margin-top:4px;

    font-size:11px;

    opacity:.9;
}

.loading{

    text-align:center;

    color:#64748b;
}

</style>

<body>

<header class="rm-site-header"><div class="rm-header-inner"><a class="rm-brand" href="index.html" aria-label="ReferMe Network homepage"><svg class="rm-network-icon" viewBox="0 0 52 48" width="43" height="40" role="img" aria-label="Trusted relationship network"><g stroke="#A6D64F" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M9 24 L24 9 L42 15 M9 24 L24 39 L42 31 M24 9 L42 31 M42 15 L24 39"/></g><circle cx="9" cy="24" r="6.5" fill="#A6D64F" stroke="#E1EDFA" stroke-width="1"/><circle cx="9" cy="22.2" r="1.7" fill="#194778"/><path d="M6 27 Q9 24 12 27" stroke="#194778" stroke-width="1.2" fill="none"/><circle cx="24" cy="9" r="6.5" fill="#2D6090" stroke="#E1EDFA" stroke-width="1"/><circle cx="24" cy="7.2" r="1.7" fill="#FFFFFF"/><path d="M21 12 Q24 9 27 12" stroke="#FFFFFF" stroke-width="1.2" fill="none"/><circle cx="42" cy="15" r="6.5" fill="#2D6090" stroke="#E1EDFA" stroke-width="1"/><circle cx="42" cy="13.2" r="1.7" fill="#FFFFFF"/><path d="M39 18 Q42 15 45 18" stroke="#FFFFFF" stroke-width="1.2" fill="none"/><circle cx="24" cy="39" r="6.5" fill="#2D6090" stroke="#E1EDFA" stroke-width="1"/><circle cx="24" cy="37.2" r="1.7" fill="#FFFFFF"/><path d="M21 42 Q24 39 27 42" stroke="#FFFFFF" stroke-width="1.2" fill="none"/><circle cx="42" cy="31" r="6.5" fill="#2D6090" stroke="#E1EDFA" stroke-width="1"/><circle cx="42" cy="29.2" r="1.7" fill="#FFFFFF"/><path d="M39 34 Q42 31 45 34" stroke="#FFFFFF" stroke-width="1.2" fill="none"/></svg><span class="rm-brand-words"><span class="rm-wordmark">refer<span class="rm-green">Me</span> Network</span><span class="rm-tagline">Connected by Trust · Growing Together</span></span></a><nav class="rm-nav" aria-label="Member navigation"><a href="dashboard.html">Dashboard</a><a href="network.html">My Network</a>

      <a href="profile.html">My Profile</a><a href="edit-profile.html">Edit Profile</a><button class="rm-logout" type="button" id="logoutBtn">Logout</button></nav></div></header>

<div class="container">

    <div class="page-title">

        <h1>
            Relationship Tree
        </h1>

        <p>
            Visualize how trusted relationships expand your network.
        </p>

    </div>

    <div class="tree-card">

        <div class="legend">

            <div class="legend-item">
                <div class="dot l0-dot"></div>
                You (L0)
            </div>

            <div class="legend-item">
                <div class="dot l1-dot"></div>
                Direct Connections (L1)
            </div>

            <div class="legend-item">
                <div class="dot l2-dot"></div>
                Trusted Introductions (L2)
            </div>

            <div class="legend-item">
                <div class="dot l3-dot"></div>
                Extended Network (L3)
            </div>

        </div>

        <div
            id="treeContainer"
            class="loading">

            Loading network...

        </div>

    </div>

</div>
<script>

const {
    Client,
    Account,
    Databases
} = Appwrite;

/* APPWRITE */

const client = new Client();

client
    .setEndpoint(
        "https://cloud.appwrite.io/v1"
    )
    .setProject(
        "6ac6fecf002db308564b"
    );

const account =
    new Account(client);

const databases =
    new Databases(client);

const DATABASE_ID =
    "myff";

const PROFILES_COLLECTION_ID =
    "Profiles";

const CONNECTIONS_COLLECTION_ID =
    "Connections";

/* HELPERS */

function getProfileName(profile){

    if(!profile){
        return "Unknown User";
    }

    return (
        `${profile.first_name || ""}
         ${profile.last_name || ""}`
    )
    .replace(/\s+/g," ")
    .trim();
}

/* BUILD BIDIRECTIONAL GRAPH */

function buildGraph(connections){

    const graph = {};

    connections.forEach(connection => {

        const from =
            connection.from_user_id;

        const to =
            connection.to_user_id;

        if(!graph[from]){
            graph[from] = [];
        }

        if(!graph[to]){
            graph[to] = [];
        }

        graph[from].push(to);

        graph[to].push(from);

    });

    return graph;
}

/* BUILD BFS TREE */

function buildTree(
    rootUserId,
    graph
){

    const tree = {};

    const visited =
        new Set();

    const queue = [];

    visited.add(
        rootUserId
    );

    queue.push(
        rootUserId
    );

    while(
        queue.length > 0
    ){

        const current =
            queue.shift();

        const neighbors =
            graph[current] || [];

        neighbors.forEach(
            neighbor => {

                if(
                    !visited.has(
                        neighbor
                    )
                ){

                    visited.add(
                        neighbor
                    );

                    queue.push(
                        neighbor
                    );

                    if(
                        !tree[current]
                    ){
                        tree[current] = [];
                    }

                    tree[current]
                        .push(
                            neighbor
                        );

                }

            }
        );

    }

    return tree;
}

/* DETERMINE LEVEL */

function getLevel(
    rootId,
    targetId,
    tree
){

    if(
        rootId === targetId
    ){
        return 0;
    }

    const queue = [

        {
            id:rootId,
            level:0
        }

    ];

    const visited =
        new Set();

    visited.add(
        rootId
    );

    while(
        queue.length > 0
    ){

        const current =
            queue.shift();

        const children =
            tree[current.id] || [];

        for(
            const child
            of children
        ){

            if(
                child === targetId
            ){

                return current.level + 1;
            }

            if(
                !visited.has(child)
            ){

                visited.add(
                    child
                );

                queue.push({

                    id:child,

                    level:
                    current.level + 1

                });

            }

        }

    }

    return 3;

}

/* CSS CLASS */

function getNodeClass(level){

    if(level === 0){
        return "l0";
    }

    if(level === 1){
        return "l1";
    }

    if(level === 2){
        return "l2";
    }

    return "l3";

}

/* RENDER TREE */

function renderTreeNode(

    userId,

    tree,

    profileMap,

    rootUserId

){

    const level =
        getLevel(

            rootUserId,

            userId,

            tree

        );

    const cssClass =
        getNodeClass(
            level
        );

    const profile =
        profileMap[userId];

    const name =
        getProfileName(
            profile
        );

    let badge = "L3";

    if(level === 0){
        badge = "YOU";
    }
    else if(level === 1){
        badge = "L1";
    }
    else if(level === 2){
        badge = "L2";
    }

    let html =

    `
    <li>

        <div
            class="node ${cssClass}">

            ${name}

            <small>

                ${badge}

            </small>

        </div>
    `;

    const children =
        tree[userId] || [];

    if(
        children.length > 0
    ){

        html += "<ul>";

        children.forEach(
            child => {

                html +=

                    renderTreeNode(

                        child,

                        tree,

                        profileMap,

                        rootUserId

                    );

            }
        );

        html += "</ul>";

    }

    html += "</li>";

    return html;

}

/* LOAD TREE */

async function loadRelationshipTree(){

    try{

        const user =
            await account.get();

        const treeContainer =
            document.getElementById(
                "treeContainer"
            );

        treeContainer.innerHTML =
            "Loading relationship tree...";

        const profilesResult =
            await databases.listDocuments(

                DATABASE_ID,

                PROFILES_COLLECTION_ID

            );

        const connectionsResult =
            await databases.listDocuments(

                DATABASE_ID,

                CONNECTIONS_COLLECTION_ID

            );

        const profileMap =
            {};

        profilesResult.documents.forEach(
            profile => {

                profileMap[
                    profile.user_id
                ] = profile;

            }
        );

        const graph =
            buildGraph(

                connectionsResult.documents

            );

        const tree =
            buildTree(

                user.$id,

                graph

            );

        treeContainer.innerHTML =

        `
        <div class="tree">

            <ul class="tree-root">

                ${

                    renderTreeNode(

                        user.$id,

                        tree,

                        profileMap,

                        user.$id

                    )

                }

            </ul>

        </div>
        `;

    }
    catch(error){

        console.error(
            error
        );

        window.location.href =
            "login.html";

    }

}

/* LOGOUT */

document
.getElementById(
    "logoutBtn"
)
.addEventListener(
    "click",
    async () => {

        try{

            await account.deleteSession(
                "current"
            );

            window.location.href =
                "login.html";

        }
        catch(error){

            console.error(
                error
            );
        }

    }
);

/* START */

loadRelationshipTree();

</script>
