<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Network Tree | ReferMe Network</title>

<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#f4f8fd;
    color:#102a43;
}

/* HEADER */

.header{

    background:
    linear-gradient(
        135deg,
        #12355b,
        #1f4e79
    );

    padding:10px 28px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.brand{

    display:flex;

    align-items:center;

    gap:12px;
}

.logo-icon{

    width:44px;

    height:44px;

    object-fit:contain;
}

.brand-text{

    display:flex;

    flex-direction:column;
}

.logo{

    display:flex;

    align-items:flex-end;
}

.logo-refer{

    color:white;

    font-size:28px;

    font-weight:800;
}

.logo-me{

    color:#8BC53F;

    font-size:28px;

    font-weight:800;
}

.logo-network{

    color:#dbeafe;

    font-size:22px;

    font-weight:600;

    margin-left:8px;
}

.tagline{

    color:#dbeafe;

    font-size:11px;
}

.header-buttons{

    display:flex;

    gap:10px;
}

.header-btn{

    background:rgba(255,255,255,.12);

    color:white;

    border:1px solid rgba(255,255,255,.2);

    padding:10px 14px;

    border-radius:10px;

    cursor:pointer;
}

.active-btn{

    background:#8BC53F;

    border-color:#8BC53F;

    color:#12355b;
}

/* PAGE */

.container{

    max-width:1400px;

    margin:24px auto;

    padding:0 20px;
}

.page-title{

    text-align:center;

    margin-bottom:24px;
}

.page-title h1{

    color:#12355b;

    margin-bottom:6px;
}

.page-title p{

    color:#64748b;
}

.tree-card{

    background:white;

    border-radius:20px;

    padding:30px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.06);
}

.legend{

    display:flex;

    gap:20px;

    justify-content:center;

    margin-bottom:30px;
}

.legend-item{

    display:flex;

    align-items:center;

    gap:8px;
}

.dot{

    width:14px;

    height:14px;

    border-radius:50%;
}

.l0-dot{
    background:#8BC53F;
}

.l1-dot{
    background:#0ea5e9;
}

.l2-dot{
    background:#EE7D11;
}

.l3-dot{
    background:#94a3b8;
}

/* TREE */

.tree{

    display:flex;

    justify-content:center;
}

.tree ul{

    padding-top:20px;

    position:relative;

    transition:.3s;
}

.tree li{

    float:left;

    text-align:center;

    list-style:none;

    position:relative;

    padding:20px 5px 0 5px;
}

/* CONNECTOR LINES */

.tree li::before,
.tree li::after{

    content:'';

    position:absolute;

    top:0;

    right:50%;

    border-top:2px solid #cbd5e1;

    width:50%;

    height:20px;
}

.tree li::after{

    right:auto;

    left:50%;

    border-left:2px solid #cbd5e1;
}

.tree li:only-child::after,
.tree li:only-child::before{

    display:none;
}

.tree li:only-child{

    padding-top:0;
}

.tree li:first-child::before{

    border:none;
}

.tree li:last-child::after{

    border:none;
}

.tree ul ul::before{

    content:'';

    position:absolute;

    top:0;

    left:50%;

    border-left:2px solid #cbd5e1;

    width:0;

    height:20px;
}

/* NODES */

.node{

    border-radius:14px;

    padding:12px 18px;

    display:inline-block;

    min-width:120px;

    color:white;

    font-weight:600;

    box-shadow:
        0 4px 12px rgba(0,0,0,.08);
}

.l0{

    background:#8BC53F;
}

.l1{

    background:#0ea5e9;
}

.l2{

    background:#EE7D11;
}

.l3{

    background:#94a3b8;
}

.node small{

    display:block;

    margin-top:4px;

    font-size:11px;

    opacity:.9;
}

.loading{

    text-align:center;

    color:#64748b;
}

</style>

</head>

<body>

<div class="header">

    <div class="brand">

        <img
            src="handlogo.png"
            class="logo-icon">

        <div class="brand-text">

            <div class="logo">

                <span class="logo-refer">Refer</span><span class="logo-me">Me</span>

                <span class="logo-network">
                    Network
                </span>

            </div>

            <div class="tagline">

                Connected by Trust • Growing Together

            </div>

        </div>

    </div>

    <div class="header-buttons">

        <button class="header-btn"
                onclick="location.href='dashboard.html'">
            Dashboard
        </button>

        <button class="header-btn"
                onclick="location.href='network.html'">
            My Network
        </button>

        <button class="header-btn active-btn">
            Network Tree
        </button>

        <button class="header-btn"
                onclick="location.href='edit-profile.html'">
            Edit Profile
        </button>

        <button class="header-btn"
                id="logoutBtn">
            Logout
        </button>

    </div>

</div>

<div class="container">

    <div class="page-title">

        <h1>
            Relationship Tree
        </h1>

        <p>
            Visualize how trusted relationships expand your network.
        </p>

    </div>

    <div class="tree-card">

        <div class="legend">

            <div class="legend-item">
                <div class="dot l0-dot"></div>
                You (L0)
            </div>

            <div class="legend-item">
                <div class="dot l1-dot"></div>
                Direct Connections (L1)
            </div>

            <div class="legend-item">
                <div class="dot l2-dot"></div>
                Trusted Introductions (L2)
            </div>

            <div class="legend-item">
                <div class="dot l3-dot"></div>
                Extended Network (L3)
            </div>

        </div>

        <div
            id="treeContainer"
            class="loading">

            Loading network...

        </div>

    </div>

</div>
<script>

const {
    Client,
    Account,
    Databases,
    Query
} = Appwrite;

const client = new Client();

client
    .setEndpoint(
        "https://cloud.appwrite.io/v1"
    )
    .setProject(
        "6ac6fecf002db308564b"
    );

const account =
    new Account(client);

const databases =
    new Databases(client);

const DATABASE_ID =
    "myff";

const PROFILES_COLLECTION_ID =
    "Profiles";

const CONNECTIONS_COLLECTION_ID =
    "Connections";

function getConnectedUserId(
    connection,
    myUserId
){

    if(
        connection.from_user_id ===
        myUserId
    ){
        return connection.to_user_id;
    }

    return connection.from_user_id;
}

function getProfileName(
    profile
){

    if(!profile)
        return "Unknown";

    return (
        (profile.first_name || "")
        + " "
        + (profile.last_name || "")
    ).trim();

}

function buildNode(
    label,
    cssClass
){

    return `
        <li>

            <div class="node ${cssClass}">

                ${label}

                <small>
                    ${cssClass.toUpperCase()}
                </small>

            </div>

        </li>
    `;
}

async function loadRelationshipTree(){

    try{

        const user =
            await account.get();

        const container =
            document.getElementById(
                "treeContainer"
            );

        container.innerHTML =
            "Loading network...";

        const profilesResult =
            await databases.listDocuments(
                DATABASE_ID,
                PROFILES_COLLECTION_ID
            );

        const connectionsResult =
            await databases.listDocuments(
                DATABASE_ID,
                CONNECTIONS_COLLECTION_ID
            );

        const profiles =
            profilesResult.documents;

        const connections =
            connectionsResult.documents;

        const profileMap = {};

        profiles.forEach(
            p => {

                profileMap[
                    p.user_id
                ] = p;

            }
        );

        const myProfile =
            profileMap[
                user.$id
            ];

        /* L1 */

        const l1Ids =
            new Set();

        connections.forEach(
            c => {

                if(
                    c.from_user_id === user.$id
                    ||
                    c.to_user_id === user.$id
                ){

                    l1Ids.add(
                        getConnectedUserId(
                            c,
                            user.$id
                        )
                    );

                }

            }
        );

        /* L2 */

        const l2Ids =
            new Set();

        connections.forEach(
            c => {

                l1Ids.forEach(
                    l1User => {

                        if(

                            c.from_user_id === l1User
                            ||
                            c.to_user_id === l1User

                        ){

                            const nextUser =
                                getConnectedUserId(
                                    c,
                                    l1User
                                );

                            if(
                                nextUser !== user.$id
                                &&
                                !l1Ids.has(
                                    nextUser
                                )
                            ){

                                l2Ids.add(
                                    nextUser
                                );

                            }

                        }

                    }
                );

            }
        );

        /* L3 */

        const l3Ids =
            new Set();

        connections.forEach(
            c => {

                l2Ids.forEach(
                    l2User => {

                        if(
                            c.from_user_id === l2User
                            ||
                            c.to_user_id === l2User
                        ){

                            const nextUser =
                                getConnectedUserId(
                                    c,
                                    l2User
                                );

                            if(
                                nextUser !== user.$id
                                &&
                                !l1Ids.has(
                                    nextUser
                                )
                                &&
                                !l2Ids.has(
                                    nextUser
                                )
                            ){

                                l3Ids.add(
                                    nextUser
                                );

                            }

                        }

                    }
                );

            }
        );

        let l1Html = "";
        let l2Html = "";
        let l3Html = "";

        l1Ids.forEach(
            userId => {

                l1Html +=
                    buildNode(
                        getProfileName(
                            profileMap[userId]
                        ),
                        "l1"
                    );

            }
        );

        l2Ids.forEach(
            userId => {

                l2Html +=
                    buildNode(
                        getProfileName(
                            profileMap[userId]
                        ),
                        "l2"
                    );

            }
        );

        l3Ids.forEach(
            userId => {

                l3Html +=
                    buildNode(
                        getProfileName(
                            profileMap[userId]
                        ),
                        "l3"
                    );

            }
        );

        container.innerHTML =

        `
        <div class="tree">

            <ul>

                <li>

                    <div class="node l0">

                        ${
                            getProfileName(
                                myProfile
                            )
                        }

                        <small>
                            YOU
                        </small>

                    </div>

                    <ul>

                        ${l1Html}

                    </ul>

                    ${
                        l2Html
                        ?
                        `
                        <ul>

                            ${l2Html}

                        </ul>
                        `
                        :
                        ""
                    }

                    ${
                        l3Html
                        ?
                        `
                        <ul>

                            ${l3Html}

                        </ul>
                        `
                        :
                        ""
                    }

                </li>

            </ul>

        </div>
        `;

    }
    catch(error){

        console.error(
            error
        );

        window.location.href =
            "login.html";

    }

}

document
.getElementById(
    "logoutBtn"
)
.addEventListener(
    "click",
    async () => {

        try{

            await account.deleteSession(
                "current"
            );

            window.location.href =
                "login.html";

        }
        catch(error){

            console.error(
                error
            );
        }

    }
);

loadRelationshipTree();

</script>

</body>
</html>
